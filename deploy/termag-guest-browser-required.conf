# Drop-in for termag-guest's user manager, installed as
# /etc/systemd/system/user@<termag-guest uid>.service.d/termag-guest-browser.conf
# by deploy/termag-guest-browser-setup.
#
# Guest Chromium only starts through snap run, which needs this user manager.
# The manager refuses to start unless termag-guest-browser.service started
# successfully, and stops if it is stopped, so a guest browser never runs
# without its egress rule.
#
# Requires= also propagates `systemctl restart` of the guard, which restarts
# this manager (and kills live guest browsers): reload it, never restart it.
[Unit]
Requires=termag-guest-browser.service
After=termag-guest-browser.service

# The guard stays active if its table is flushed (`nft flush ruleset`), which
# Requires= can't see, so every start reapplies the rules first and fails if
# they don't load. `+` because user@ would otherwise run it as the user.
[Service]
ExecStartPre=+/usr/bin/systemctl reload termag-guest-browser.service
