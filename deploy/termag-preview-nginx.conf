# nginx.service drop-in (installed as
# /etc/systemd/system/nginx.service.d/termag-preview.conf by
# packer/scripts/orchestrator-setup.sh): render the preview server block's
# server_name from PREVIEW_LINKS_DOMAIN in the backend's .env before every
# nginx start
# (backend/src/scripts/previewNginxSnippet.ts). cloud-init writes the .env and
# then starts nginx, so the first boot of every instance renders it.
#
# It runs as root, so the bake installs a root-owned copy of the compiled
# script and its one import (services/previewHostGrammar.js) under
# /usr/local/lib/termag: /opt/termag belongs to the termag user, which could
# otherwise rewrite what root runs here.
#
# The leading `-`: an unset or malformed domain, or a snippet nginx refuses,
# leaves no snippet and preview hosts matching nothing, never a gateway that
# won't start. The script logs why to this unit's journal.
#
# A changed domain needs `systemctl restart nginx` (a reload doesn't re-render);
# on the orchestrator it only changes with a new instance anyway.
[Service]
ExecStartPre=-/usr/bin/node /usr/local/lib/termag/preview-nginx/scripts/previewNginxSnippet.js
