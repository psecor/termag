# Drop-in for user@.service and ssh.service on the orchestrator, installed as
# /etc/systemd/system/<unit>.d/termag-imds-guard.conf by
# packer/scripts/orchestrator-setup.sh.
#
# Host accounts (uid 1000-59999) must never run anything while they can reach
# instance metadata. Their processes start in one of two ways: a user manager
# (lingering, or any login through pam_systemd) or an SSH login. Both units
# refuse to start unless termag-imds-guard.service started successfully, and
# stop if it is stopped. A missing guard unit fails them too.
#
# Requires= also propagates `systemctl restart` of the guard, which would
# restart every user manager and sshd: reload it, never restart it.
[Unit]
Requires=termag-imds-guard.service
After=termag-imds-guard.service

# The guard stays active if its table is flushed (`nft flush ruleset`), which
# Requires= can't see, so every start reapplies the rules first and fails if
# they don't load. `+` because user@ would otherwise run it as the user.
[Service]
ExecStartPre=+/usr/bin/systemctl reload termag-imds-guard.service
