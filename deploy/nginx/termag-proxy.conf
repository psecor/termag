# Shared proxy boilerplate for termag-hosted apps. Include from inside a
# `location` block, after `proxy_pass`:
#
#   location /myapp {
#       proxy_pass http://127.0.0.1:3101;
#       include /etc/nginx/snippets/termag-proxy.conf;
#   }
#
# Covers websocket upgrades (terminals, live-reload), long-lived idle
# connections, and streaming responses (SSE / chunked agent output).

proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# SECURITY, do not drop this: the peer nginx actually accepted the connection
# from. Once nginx fronts the backend, every upstream socket peer is loopback,
# so a backend that reads its own TCP peer sees 127.0.0.1 for remote callers
# too — and termag grants same-host callers extra trust (status writes skip
# auth; see authStatusWrite in backend/src/routes/status.ts). $remote_addr
# restores the distinction, and `proxy_set_header` OVERWRITES whatever the
# client sent, so it cannot be forged from outside. The backend only believes
# this header when its own socket peer is loopback, i.e. when nginx is the one
# that handed over the request.
proxy_set_header X-Termag-Peer-Addr $remote_addr;

# SECURITY: clear the preview-host markers on every normal (main-host)
# upstream. The preview server block (termag-gateway.conf) re-sets them after
# including this snippet; everywhere else they must be blank, so a client on
# the main host can't forge X-Termag-Preview-Host to steer a request into the
# preview world, or name a preview. Like X-Termag-Peer-Addr, proxy_set_header
# overwrites whatever the client sent, so the forgery can't survive.
proxy_set_header X-Termag-Preview-Host "";
proxy_set_header X-Termag-Preview-Name "";

# SECURITY: termag's session cookie only goes to termag's own /termag paths;
# a hosted app gets the Cookie header without it ($termag_upstream_cookie in
# termag-gateway.conf, which defines it for every server that includes this).
proxy_set_header Cookie $termag_upstream_cookie;

# Idle terminals and agent streams sit quiet for a long time; don't cut them.
proxy_read_timeout 1h;
proxy_send_timeout 1h;

# Don't buffer streaming bodies (SSE, incremental agent output).
proxy_buffering off;
