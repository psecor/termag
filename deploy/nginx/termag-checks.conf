# The orchestrator's check routes for the Claude gateway's Envoy
#: every Claude and GitHub broker request is
# decided by an ext_authz call to one of the two locations below.
#
# Envoy reaches them through terraform's orchestrator checks ALB
# (https://orchestrator.<zone>, internal, ACM certificate), which forwards only
# /termag/internal/* here. Only that ALB's security group can reach :3041; the
# public ALB and boxes use :3040 (termag-gateway.conf), which answers
# /termag/internal/ with 404. The backend decides each check on the gateway's
# STS caller proof alone, so reaching this port grants nothing by itself.

server {
    listen 3041;
    server_name _;

    # The ALB's target health check.
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # The gateway's ext_authz check for each Claude call
    # (backend/src/routes/claudeAuthz.ts). Envoy sends no body.
    location /termag/internal/claude-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 0;
    }

    # The gateway's ext_authz check for the GitHub broker
    # (backend/src/routes/githubAuthz.ts). It carries no git or API body beyond
    # the GraphQL and repository-PATCH checks, which Envoy caps at 4 MiB.
    location /termag/internal/github-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 8m;
    }

    location / {
        return 404;
    }
}
