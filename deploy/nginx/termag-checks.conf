# The orchestrator's check routes for the Claude gateway's Envoy
# every Claude, GitHub broker, MCP broker and Fireworks request is decided by
# an ext_authz call to one of the four locations below.
#
# Envoy reaches them through terraform's orchestrator checks ALB
# (https://orchestrator.<zone>, internal, ACM certificate), which forwards only
# /termag/internal/* here. Only that ALB's security group can reach :3041; the
# public ALB and boxes use :3040 (termag-gateway.conf), which answers
# /termag/internal/ with 404. The backend decides each check on the gateway's
# STS caller proof alone, so reaching this port grants nothing by itself.

server {
    listen 3041;
    server_name _;

    # The ALB's target health check: the backend's own serving check, so the
    # ALB sends checks only to a backend that is up and holds the lease. A
    # fixed 200 here kept a new host healthy while its backend was still
    # starting, and every check it got came back 502 from nginx, which Envoy
    # turns into a 503 for the box's git, gh or model call.
    location = /healthz {
        proxy_pass http://127.0.0.1:3100/termag/health/serving;
        include /etc/nginx/snippets/termag-proxy.conf;
    }

    # The gateway's ext_authz check for each Claude call
    # (backend/src/routes/claudeAuthz.ts). Envoy sends no body.
    location /termag/internal/claude-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 0;
    }

    # The gateway's ext_authz check for the GitHub broker
    # (backend/src/routes/githubAuthz.ts). It carries no git or API body beyond
    # the GraphQL and repository-PATCH checks, which Envoy caps at 4 MiB.
    location /termag/internal/github-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 8m;
    }

    # The gateway's ext_authz check for each MCP broker request
    # (backend/src/routes/mcpAuthz.ts). Envoy sends no body.
    location /termag/internal/mcp-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 0;
    }

    # The gateway's ext_authz check for each Fireworks call
    # (backend/src/routes/fireworksAuthz.ts). Envoy sends no
    # body; it reads the model itself.
    location /termag/internal/fireworks-authz/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        client_max_body_size 0;
    }

    location / {
        return 404;
    }
}
