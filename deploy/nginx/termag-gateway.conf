# nginx gateway for the termag orchestrator host.
#
# All external traffic (the ALB's single :3040 target group AND box agents
# dialing back over the private VPC network) lands here. nginx fans out by
# path prefix to apps listening on localhost — termag itself included.
#
# Hosted apps register themselves by dropping a route snippet at
# /srv/termag/apps/<name>/nginx.conf (persistent EBS volume, survives
# instance replacement). See docs/hosted-apps.md. The wildcard include below
# is deliberately tolerant: no matching files is not an error, so this config
# is valid at AMI bake time before /srv/termag exists.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The browser session cookie is `__Host-termag.sid` on `Path=/`
# (backend/src/auth/sessionCookie.ts), so the browser sends it with every
# request to this host, hosted apps' included. termag-proxy.conf forwards
# $termag_upstream_cookie: the whole Cookie header to termag's own /termag
# paths, and the header without that pair to everything else, so a hosted
# app's server never holds a termag session. The pair may be first, last or
# between others; a name that only ends in it (x__Host-termag.sid) is kept.
map $http_cookie $termag_cookie_sans_session {
    "~^(?<termag_ck_before>(?:.*?;\s*)?)__Host-termag\.sid=[^;]*(?:;\s*)?(?<termag_ck_after>.*)$" "$termag_ck_before$termag_ck_after";
    default $http_cookie;
}
map $uri $termag_upstream_cookie {
    "~^/termag(?:/|$)" $http_cookie;
    default            $termag_cookie_sans_session;
}

# Box agents send their tmag_ token as `Authorization: Bearer`; agents from
# before that put it in the URL (/termag/ws/agent?token=tmag_...), so the
# request line of every one of their connects carries it. The agent location
# below logs the path without the query string, and which form the token came
# in, so the transition can be followed in the log without writing a token.
map $http_authorization $termag_agent_auth_form {
    "~*^Bearer\s" header;
    default       none;
}
map $arg_token $termag_agent_token_form {
    ""      $termag_agent_auth_form;
    default query;
}
log_format termag_agent_ws '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "-" "$http_user_agent" token=$termag_agent_token_form';

# Preview links' secrets never reach a log line. The box confirmation's id, in the
# confirm page /termag/previews/confirm/<id> and the CLI's poll
# /termag/api/cli/v1/preview-links/confirmations/<id>, is the key the
# confirmation's sealed share URL opens with, so an access log holding it and
# a backup of the row would give a link token: both are logged as <redacted>.
# Every other request line is as the default format writes it, query string
# included. First match wins (PCRE). Then the preview landing's own (row 2b):
# a link token in /termag/previews/<name>/<token>, and the whole query of any
# landing URL: a reverify's ?ticket=, and the ?next= a preview host sends a
# signed-out viewer back with, which percent-encodes the app's own URL and its
# query (an OAuth code=, a token=) past the collector's name rules. Likewise a
# preview host's /__termag/auth (its ?code=). A map rewrites one match, and a
# repeated ticket= or code= must not leave one in the clear. The lookahead
# keeps /termag/previews/<name>/reverify readable.
map $request_uri $termag_log_uri {
    "~^(/termag/previews/confirm/)[^/?#]+(.*)$"                             "$1<redacted>$2";
    "~^(/termag/api/cli/v1/preview-links/confirmations/)[^/?#]+(.*)$"       "$1<redacted>$2";
    "~^(/termag/previews/[^/?]+/reverify)\?.*$"                           "$1?<redacted>";
    "~^(/termag/previews/[^/?]+/)(?!reverify(?:[/?#]|$))[^/?#]+([^?]*)\?.*$" "$1<redacted>$2?<redacted>";
    "~^(/termag/previews/[^/?]+/)(?!reverify(?:[/?#]|$))[^/?#]+(.*)$"       "$1<redacted>$2";
    "~^(/termag/previews/[^/?]+)\?.*$"                                     "$1?<redacted>";
    "~^(/__termag/auth)\?.*$"                                               "$1?<redacted>";
    default $request_uri;
}
# The Referer gets the same care: a page on a preview URL that links elsewhere
# would carry its token, ticket, code or confirmation id in the next request's
# Referer. The landing page sends Referrer-Policy: no-referrer, so a browser
# shouldn't; if one does, everything after the preview path is <redacted> in the
# access log. An upstream error line quotes the Referer too; the collector's
# path-token rule masks it there before it leaves the host.
map $http_referer $termag_log_referer {
    ""                                                                                                     "-";
    "~^(https?://[^/?#]*)(/termag/previews/|/__termag/|/termag/api/cli/v1/preview-links/confirmations/)"  "$1$2<redacted>";
    default $http_referer;
}
log_format termag_redacted '$remote_addr - $remote_user [$time_local] "$request_method $termag_log_uri $server_protocol" '
                           '$status $body_bytes_sent "$termag_log_referer" "$http_user_agent"';

server {
    listen 3040 default_server;
    server_name _;
    access_log /var/log/nginx/access.log termag_redacted;

    # Uploads (project archives, clipboard images) can be chunky.
    client_max_body_size 200m;

    # With AUTH_MODE=okta the ALB's authenticate-oidc action fronts this port
    # and hands every browser request a large Cookie header
    # (AWSELBAuthSessionCookie-0..N, ~4k per shard, all in ONE header line)
    # plus x-amzn-oidc-data / -accesstoken JWTs. nginx's default of
    # `4 8k` rejects a header line over 8k with a bare 400 that the app never
    # sees — and the ALB health check carries no cookies, so the target stays
    # healthy while every real user is locked out. Node's own limit is 16k for
    # the whole header block, so 32k here keeps nginx from being the first
    # thing to fail and keeps the failure legible.
    large_client_header_buffers 4 32k;

    # The ALB already redirects / -> /termag/ at priority 1; mirror it here so
    # direct VPC clients hitting the bare host land on the app too.
    location = / {
        return 301 /termag/;
    }

    # termag backend (serves the built frontend + API + agent websockets).
    #
    # termag-proxy.conf sets X-Termag-Peer-Addr from $remote_addr; the backend
    # needs it to tell a genuinely same-host caller (Claude Code hooks curling
    # localhost, which are trusted for status writes) from an ALB or VPC client
    # that nginx has collapsed to a loopback upstream peer. Any snippet that
    # proxies to the termag backend MUST include termag-proxy.conf for the same
    # reason — see docs/hosted-apps.md.
    # The gateway's ext_authz checks come only over :3041 (termag-checks.conf),
    # through terraform's internal checks ALB. The backend decides them on the
    # caller proof alone; keeping them off this listener means nothing that
    # reaches :3040 (the public ALB, boxes) can even ask.
    location ^~ /termag/internal/ {
        return 404;
    }

    # The box confirmation's id is in these two paths (the map above), and
    # nginx's error log quotes the whole request line: they log only crit and
    # above, as the agent location does. The backend logs their failures itself.
    location ^~ /termag/previews/confirm/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        error_log /var/log/nginx/error.log crit;
    }
    location ^~ /termag/api/cli/v1/preview-links/confirmations/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        error_log /var/log/nginx/error.log crit;
    }

    # nginx's error log always quotes the full request line, so this location
    # logs only crit and above: an old agent's reconnects while the backend
    # restarts would otherwise write its token once per attempt. The same
    # upstream errors still show for /termag below. Drop the error_log line
    # once no agent sends the query form (admin System page, "agent token in
    # URL"), not merely once the backend refuses it.
    location = /termag/ws/agent {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        access_log /var/log/nginx/access.log termag_agent_ws;
        error_log /var/log/nginx/error.log crit;
    }

    # The preview landing page carries a link token in its path and a reverify
    # ticket in its query. nginx's error log quotes the whole request line, so
    # it logs only crit and above here, as the agent location does.
    location ^~ /termag/previews/ {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        error_log /var/log/nginx/error.log crit;
    }

    location /termag {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
    }

    # Hosted apps — one snippet per app, on the persistent volume.
    include /srv/termag/apps/*/nginx.conf;
}

# Preview links:
# <name>.<preview domain>, a registrable domain of its own. The ALB routes the
# domain's wildcard to this same :3040 target group with no Okta action; the
# backend's preview host (backend/src/services/previewHost.ts) is the only
# thing behind this block, and it never serves termag there.
#
# The host's first label (`<name>--<suffix>`, or a bare name the backend sends
# to the landing page), passed on as the name. It stays at http level, so the
# variable exists when no snippet is rendered. It holds no grammar of its own:
# only a host the rendered server_name accepts reaches the block that uses it,
# and that regex is generated from the backend's (services/previewHostGrammar.ts),
# whose classifyHost checks the label again along with the whole Host.
map $host $termag_preview_name {
    "~^([^.]+)\." $1;
    default "";
}

server {
    listen 3040;
    # The preview domain is kept out of the tree, like a deployment's other
    # hosts. Before every nginx start,
    # backend/src/scripts/previewNginxSnippet.ts (deploy/termag-preview-nginx.conf)
    # renders the real line from PREVIEW_LINKS_DOMAIN into the snippet below:
    # the backend's host-label grammar, the domain escaped for the regex, all
    # quoted, since nginx reads a bare `{` as a block:
    #   server_name "~^<label grammar>\.<escaped preview domain>$";
    # Without it (unset or malformed domain) this block matches nothing: the
    # name here is reserved (RFC 2606), and the glob allows a missing file.
    server_name termag-preview.invalid;
    include /etc/nginx/snippets/termag-preview-server-name*.conf;
    access_log /var/log/nginx/access.log termag_redacted;
    # nginx's error log quotes the whole request line: a /__termag/auth code,
    # or an app's own query string. The backend logs preview failures itself.
    error_log /var/log/nginx/error.log crit;

    # U1: the backend refuses a body past this too.
    client_max_body_size 100m;
    large_client_header_buffers 4 32k;

    # No location is special here: a preview's /termag/... is the app's path,
    # never termag's (SR3). Everything goes to the backend's preview dispatch.
    location / {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        # After the snippet, which clears both on every other upstream: nginx
        # sends only the non-empty one of two values for a name.
        proxy_set_header X-Termag-Preview-Host 1;
        proxy_set_header X-Termag-Preview-Name $termag_preview_name;
    }
}
