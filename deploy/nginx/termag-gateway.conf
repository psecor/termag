# nginx gateway for the termag orchestrator host.
#
# All external traffic (the ALB's single :3040 target group AND box agents
# dialing back over the private VPC network) lands here. nginx fans out by
# path prefix to apps listening on localhost — termag itself included.
#
# Hosted apps register themselves by dropping a route snippet at
# /srv/termag/apps/<name>/nginx.conf (persistent EBS volume, survives
# instance replacement). See docs/hosted-apps.md. The wildcard include below
# is deliberately tolerant: no matching files is not an error, so this config
# is valid at AMI bake time before /srv/termag exists.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Box agents send their tmag_ token as `Authorization: Bearer`; agents from
# before that put it in the URL (/termag/ws/agent?token=tmag_...), so the
# request line of every one of their connects carries it. The agent location
# below logs the path without the query string, and which form the token came
# in, so the transition can be followed in the log without writing a token.
map $http_authorization $termag_agent_auth_form {
    "~*^Bearer\s" header;
    default       none;
}
map $arg_token $termag_agent_token_form {
    ""      $termag_agent_auth_form;
    default query;
}
log_format termag_agent_ws '$remote_addr - - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent "-" "$http_user_agent" token=$termag_agent_token_form';

server {
    listen 3040 default_server;
    server_name _;

    # Uploads (project archives, clipboard images) can be chunky.
    client_max_body_size 200m;

    # With AUTH_MODE=okta the ALB's authenticate-oidc action fronts this port
    # and hands every browser request a large Cookie header
    # (AWSELBAuthSessionCookie-0..N, ~4k per shard, all in ONE header line)
    # plus x-amzn-oidc-data / -accesstoken JWTs. nginx's default of
    # `4 8k` rejects a header line over 8k with a bare 400 that the app never
    # sees — and the ALB health check carries no cookies, so the target stays
    # healthy while every real user is locked out. Node's own limit is 16k for
    # the whole header block, so 32k here keeps nginx from being the first
    # thing to fail and keeps the failure legible.
    large_client_header_buffers 4 32k;

    # The ALB already redirects / -> /termag/ at priority 1; mirror it here so
    # direct VPC clients hitting the bare host land on the app too.
    location = / {
        return 301 /termag/;
    }

    # termag backend (serves the built frontend + API + agent websockets).
    #
    # termag-proxy.conf sets X-Termag-Peer-Addr from $remote_addr; the backend
    # needs it to tell a genuinely same-host caller (Claude Code hooks curling
    # localhost, which are trusted for status writes) from an ALB or VPC client
    # that nginx has collapsed to a loopback upstream peer. Any snippet that
    # proxies to the termag backend MUST include termag-proxy.conf for the same
    # reason — see docs/hosted-apps.md.
    # The gateway's ext_authz checks come only over :3041 (termag-checks.conf),
    # through terraform's internal checks ALB. The backend decides them on the
    # caller proof alone; keeping them off this listener means nothing that
    # reaches :3040 (the public ALB, boxes) can even ask.
    location ^~ /termag/internal/ {
        return 404;
    }

    # nginx's error log always quotes the full request line, so this location
    # logs only crit and above: an old agent's reconnects while the backend
    # restarts would otherwise write its token once per attempt. The same
    # upstream errors still show for /termag below. Drop the error_log line
    # once no agent sends the query form (admin System page, "agent token in
    # URL"), not merely once the backend refuses it.
    location = /termag/ws/agent {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
        access_log /var/log/nginx/access.log termag_agent_ws;
        error_log /var/log/nginx/error.log crit;
    }

    location /termag {
        proxy_pass http://127.0.0.1:3100;
        include /etc/nginx/snippets/termag-proxy.conf;
    }

    # Hosted apps — one snippet per app, on the persistent volume.
    include /srv/termag/apps/*/nginx.conf;
}

# Isolated, Okta-fronted host for user/preview apps. The
# ALB routes <preview-host> to this same :3040 target group after the same Okta
# gate; the regex server_name matches it as `preview.<zone>` without naming the
# zone here (kept out of the tree for the public mirror). A different host from
# the termag UI means the browser never sends termag.sid here (host-only cookie)
# and the backend's WebSocket Origin guard rejects this origin — so a preview
# app can't ride a termag session.
#
# Everything on this host goes through the termag backend's app proxy, tagged by
# the X-Termag-App-Proxy marker below. The backend verifies the Okta JWT itself
# (closing the edge-only VPC bypass), authorizes the viewer against the session's
# project, strips the ALB/Okta identity headers, and tunnels the bytes to the
# published localhost port on the box over that box's agent connection. The
# marker is set here and cleared on the main host (termag-proxy.conf), so only
# genuine preview-host traffic ever carries it.
server {
    listen 3040;
    server_name ~^preview\.;

    client_max_body_size 200m;
    large_client_header_buffers 4 32k;  # Okta/ELB cookies are large (see above)

    location / {
        proxy_pass http://127.0.0.1:3100;
        # Gives websocket upgrade + streaming handling and passes the Okta
        # header through so the backend can verify it. The backend strips the
        # Okta headers before any byte reaches the box app.
        include /etc/nginx/snippets/termag-proxy.conf;
        # Overrides termag-proxy.conf's clearing (below) for this host only.
        proxy_set_header X-Termag-App-Proxy 1;
    }
}
